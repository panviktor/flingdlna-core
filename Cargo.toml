[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["FlingDLNA contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
axum = "0.8"

# UPnP/SSDP
rupnp = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37"
toml = "0.8"

# Directory paths
dirs = "5.0"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio-util = { version = "0.7", features = ["io"] }
local-ip-address = "0.6"
mime_guess = "2.0"
chrono = { version = "0.4", features = ["serde"] }
socket2 = "0.5"
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
libc = "0.2"
hostname = "0.4"
sha2 = "0.10"

# File watching
notify = "8.0"
notify-debouncer-full = "0.5"

# Chromecast (optional)
rust_cast = "0.19"
mdns-sd = "0.11"
flume = "0.11"

# Media metadata
lofty = "0.22"
mp4 = "0.14"
matroska = "0.30"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Internal crates
dlna-core = { path = "crates/dlna-core" }
dlna-server = { path = "crates/dlna-server" }
dlna-controller = { path = "crates/dlna-controller" }
dlna-combo = { path = "crates/dlna-combo" }

[package]
name = "flingdlna"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "flingdlna"
path = "src/main.rs"

[features]
default = ["daemon"]
daemon = ["dlna-combo/daemon"]  # Unix socket daemon (not needed for FFI builds)

[dependencies]
dlna-combo.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
ratatui.workspace = true
crossterm.workspace = true
url.workspace = true
hostname.workspace = true

[patch.crates-io]
rust_cast = { path = "vendor/rust_cast" }
